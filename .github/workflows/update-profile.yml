name: update-profile

# Regenera stats, cards de projeto, linguagens, orgs e atividade recente.
# Commits feitos com o GITHUB_TOKEN não disparam workflows, então não há loop.
on:
  schedule:
    - cron: "7 9 * * *" # todo dia, 06:07 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/generated/**"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar perfil
        run: node scripts/update-profile.mjs
        env:
          # PROFILE_TOKEN é opcional (PAT só leitura). Sem ele, usa o token da própria Action.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore(profile): atualização automática"
            git push
          fi
